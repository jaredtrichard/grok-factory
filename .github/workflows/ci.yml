name: ci

on:
  push:
  pull_request:

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required pack files
        run: |
          set -euo pipefail
          for f in \
            README.md \
            LICENSE \
            GROK_FACTORY.md \
            GROK_BOT_FIRSTMATE.md \
            GROK_BOT_CREWMATE.md \
            GROK_BOT_SCANNER.md \
            GROK_BOT_RESEARCHER.md \
            skills/project-management/SKILL.md \
            skills/research-book/SKILL.md \
            skills/memory/SKILL.md \
            skills/adversarial-review/SKILL.md \
            skills/ahoy/SKILL.md \
            skills/lavish-session/SKILL.md
          do
            test -f "$f"
          done
      - name: Standalone and vocabulary scrubs
        run: |
          set -euo pipefail
          if git grep -n -F -e 'grok-ship' -e 'Grok Ship' -- '*.md'; then
            echo 'forbidden: outside-pack reference' >&2
            exit 1
          fi
          if git grep -n -E '`LONG`|`SHORT`|`PASS`|[[:space:]]LONG,[[:space:]]SHORT|long/short/pass' -- '*.md'; then
            echo 'forbidden: direction-label vocabulary' >&2
            exit 1
          fi
          if git grep -n -i -E 'sector[- ]researcher|sector[- ]bot|sector table' -- '*.md'; then
            echo 'forbidden: sector-researcher mention' >&2
            exit 1
          fi
